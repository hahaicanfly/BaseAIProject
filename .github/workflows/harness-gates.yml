name: Harness Gates

# PR-time mechanical gates. These jobs REUSE the same detection logic as the
# local Claude Code hooks (.claude/hooks/pre-tool-use-guard.py secret-file
# patterns, .claude/hooks/post-edit-lint.py QUICK_CHECKS regexes) so CI stays
# in sync with local enforcement instead of duplicating the rules. See
# docs/plans/active/F-001-harness-verifiability-batch.md step C2d.

on:
  pull_request:

jobs:
  py-compile:
    name: py-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile hook and script python files
        run: |
          set -uo pipefail
          # scripts/ may not exist yet on some branches; find on a missing
          # path just emits stderr for that arg and still returns results
          # for the paths that do exist, so this is a safe guard either way.
          found=$(find .claude/hooks scripts -name '*.py' -type f 2>/dev/null)
          if [ -z "$found" ]; then
            echo "::notice::No python files found under .claude/hooks or scripts/; nothing to compile."
            exit 0
          fi
          echo "Compiling:"
          status=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "  $f"
            python3 -m py_compile "$f" || status=1
          done <<< "$found"
          if [ "$status" -ne 0 ]; then
            echo "py-compile: FAILED"
            exit 1
          fi
          echo "py-compile: all files compiled OK"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan changed files and added diff lines for secrets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          git fetch origin "${BASE_REF}" --depth=1 2>/dev/null || true
          python3 - <<'PYEOF'
          import importlib.util
          import os
          import re
          import subprocess
          import sys

          BASE_REF = os.environ["BASE_REF"]
          DIFF_RANGE = f"origin/{BASE_REF}...HEAD"


          def load_module(path, name):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          # Import the actual hook modules so CI reuses the same rules as the
          # local pre-tool-use-guard / post-edit-lint hooks instead of
          # duplicating them. Both hooks guard their side effects behind
          # `if __name__ == "__main__":`, so exec_module() here only defines
          # functions/constants and never runs main().
          guard = load_module(".claude/hooks/pre-tool-use-guard.py", "pre_tool_use_guard")
          lint = load_module(".claude/hooks/post-edit-lint.py", "post_edit_lint")

          sensitive_file_patterns = [(re.compile(p), code, desc) for p, code, desc in guard._SECRET_FILES]
          quick_checks = lint.QUICK_CHECKS
          print(f"loaded {len(sensitive_file_patterns)} sensitive file patterns, {len(quick_checks)} quick checks")

          changed = subprocess.run(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", DIFF_RANGE],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          changed = [f for f in changed if f.strip()]

          failed = False

          # 1) changed file paths vs sensitive-file patterns (basename match,
          # same patterns pre-tool-use-guard.py uses to block reads/git-add).
          for f in changed:
              basename = f.rsplit("/", 1)[-1]
              for pat, code, desc in sensitive_file_patterns:
                  if pat.fullmatch(basename):
                      print(f"::error::SENSITIVE-FILE HIT: {f} matches {code} ({desc})")
                      failed = True

          # 2) added diff lines vs post-edit-lint.py QUICK_CHECKS regexes.
          # Scope: real code only. Markdown (pedagogical leak examples in
          # security docs) and this workflow itself (its own print lines
          # contain the word "secret" in job names — first live run flagged
          # `print("secret-scan: FAIL")`) stay covered by the local
          # post-edit-lint sentinel as warn-only, but must not hard-fail CI.
          def quickcheck_exempt(path):
              return path is None or path.endswith(".md") or path.startswith(".github/workflows/")

          diff_output = subprocess.run(
              ["git", "diff", "--unified=0", DIFF_RANGE],
              capture_output=True, text=True, check=True,
          ).stdout

          current_file = None
          for line in diff_output.splitlines():
              if line.startswith("+++ "):
                  path = line[4:]
                  current_file = path[2:] if path.startswith("b/") else path
                  continue
              if line.startswith("+++") or line.startswith("---"):
                  continue
              if line.startswith("+"):
                  if quickcheck_exempt(current_file):
                      continue
                  added_line = line[1:]
                  for inv_id, pat, hint in quick_checks:
                      if pat.search(added_line):
                          print(f"::error::SENSITIVE-PATTERN HIT: {current_file}: {inv_id} - {hint}")
                          print(f"  line: {added_line.strip()}")
                          failed = True

          if failed:
              print("secret-scan: FAIL")
              sys.exit(1)
          print("secret-scan: PASS (no findings)")
          PYEOF

  execplan-lint:
    name: execplan-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lint changed ExecPlans
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          git fetch origin "${BASE_REF}" --depth=1 2>/dev/null || true
          changed=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD")
          plan_changed=$(printf '%s\n' "$changed" | grep -c '^docs/plans/' || true)
          if [ "$plan_changed" -eq 0 ]; then
            echo "::notice::No docs/plans/ changes in this PR; skipping execplan-lint."
            exit 0
          fi
          if [ ! -f scripts/execplan-lint.py ]; then
            echo "::notice::scripts/execplan-lint.py not present yet on this branch; skipping execplan-lint (no-op until that script merges)."
            exit 0
          fi
          active_files=$(printf '%s\n' "$changed" | grep '^docs/plans/active/.*\.md$' || true)
          if [ -z "$active_files" ]; then
            echo "::notice::No changed docs/plans/active/*.md files; nothing to lint."
            exit 0
          fi
          echo "Linting:"
          printf '%s\n' "$active_files"
          printf '%s\n' "$active_files" | xargs -r python3 scripts/execplan-lint.py

  placeholder-gate:
    name: placeholder-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail on unfilled {{ }} placeholders added outside templates
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          git fetch origin "${BASE_REF}" --depth=1 2>/dev/null || true
          python3 - <<'PYEOF'
          import os
          import re
          import subprocess
          import sys

          BASE_REF = os.environ["BASE_REF"]
          DIFF_RANGE = f"origin/{BASE_REF}...HEAD"

          # Unfilled template slots live in markdown/config docs, so this
          # gate scans ADDED lines of *.md files only — .py/.yml legitimately
          # contain literal "{{" (the placeholder DETECTORS themselves, and
          # GitHub Actions' own dollar-brace expression syntax; the first
          # live run flagged its own implementation). Within a line: inline
          # spans` are stripped first (docs QUOTING a placeholder are fine),
          # and only a non-$-prefixed {{ counts (real slot, not an Actions
          # expression). Template-path files may introduce placeholders.
          TEMPLATE_DIR_RE = re.compile(r"(^|/)\.claude/templates/", re.IGNORECASE)
          TEMPLATE_PATH_RE = re.compile(r"template", re.IGNORECASE)
          HUNK_RE = re.compile(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@")
          CODE_SPAN_RE = re.compile(r"`[^`]*`")
          PLACEHOLDER_RE = re.compile(r"(?<!\$)\{\{")

          diff_output = subprocess.run(
              ["git", "diff", "--unified=0", DIFF_RANGE],
              capture_output=True, text=True, check=True,
          ).stdout

          current_file = None
          new_lineno = None
          failed = False

          for line in diff_output.splitlines():
              if line.startswith("+++ "):
                  path = line[4:]
                  current_file = path[2:] if path.startswith("b/") else path
                  new_lineno = None
                  continue
              if line.startswith("+++") or line.startswith("---"):
                  continue
              m = HUNK_RE.match(line)
              if m:
                  new_lineno = int(m.group(1))
                  continue
              if line.startswith("+"):
                  added_line = line[1:]
                  if new_lineno is not None:
                      this_lineno = new_lineno
                      new_lineno += 1
                  else:
                      this_lineno = -1
                  if current_file is None or not current_file.endswith(".md"):
                      continue
                  if TEMPLATE_DIR_RE.search(current_file) or TEMPLATE_PATH_RE.search(current_file):
                      continue
                  scannable = CODE_SPAN_RE.sub("", added_line)
                  if PLACEHOLDER_RE.search(scannable):
                      print(f"::error::PLACEHOLDER HIT: {current_file}:{this_lineno}: {added_line.strip()}")
                      failed = True

          if failed:
              print("placeholder-gate: FAIL")
              sys.exit(1)
          print("placeholder-gate: PASS (no unfilled placeholders introduced)")
          PYEOF
